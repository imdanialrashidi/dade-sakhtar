# Minimal static deployment for GitHub Pages (project sites under /<repo>/).
#
# Custom-domain deployments (e.g. https://dade-sakhtar.danialrashidi.ir):
# a `public/CNAME` file in this repo pins the domain on every deploy, and the
# two repository variables below switch the build from project-site paths to
# root paths. Set both once in Settings → Variables → Actions:
#   DEPLOY_BASE = /
#   SITE_URL    = https://dade-sakhtar.danialrashidi.ir
#
# Node 22 is the version this template is developed and verified against.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a publish halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # A repo named "physics2" is served from /physics2/, so every asset
          # and link Astro emits has to carry that prefix. SITE_URL stays the
          # bare origin: absolute URLs gain BASE_PATH exactly once in code.
          BASE_PATH: ${{ vars.DEPLOY_BASE || format('/{0}', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
        run: npm run build

      - name: Validate built output
        run: node scripts/validate-content.mjs --links

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.0